name: PCG Stage 33 private intake preflight
on:
  push:
    branches:
      - research/self-hosted-runner-smoke
    paths:
      - .github/workflows/stage33-intake-preflight.yml
permissions: {}
jobs:
  preflight:
    if: github.repository == 'kxsxlxv/PCG' && github.ref == 'refs/heads/research/self-hosted-runner-smoke' && github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    steps:
      - name: Synthetic tests and optional private local intake
        shell: cmd
        env:
          PCG_SCRIPT: |
            set -euo pipefail
            export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_TERMINAL_PROMPT=0
            export PYTHONHASHSEED=0 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
            work=$(mktemp -d -t pcg-stage33.XXXXXXXX)
            trap 'rm -rf -- "$work"' EXIT
            cd "$work"
            python3 -m venv venv
            git init -q src
            cd src
            git -c core.hooksPath=/dev/null fetch --quiet --depth=1 https://github.com/kxsxlxv/PCG.git ab608e8829daa3e70931edd8599b200e520be6fd
            git -c core.hooksPath=/dev/null checkout --quiet --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = ab608e8829daa3e70931edd8599b200e520be6fd
            ../venv/bin/python -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple --no-cache-dir -r lab/requirements.txt
            export PYTHONPATH=src:lab
            ../venv/bin/python -m unittest discover -s tests/unit -v
            echo STAGE33_SYNTHETIC_PASS
            low=buildings_2012.zip
            high=a69803a3e1134ec7ba96398d19eb8ade.gltf
            win=$(wslpath -a -u "$1")
            # Owner has staged the exact inputs here. Do not search other directories.
            dir="$win/pcg-reference"
            low_path="$dir/$low"; high_path="$dir/$high"
            low_hash=8082c844fd66ddcc1cd8606c55ab1dc74e02edc3977c662ed87f5beeeffbeb8e
            high_hash=85bd5d73832d0cc3e2f6f9cd429b32c05614ba4ab0ee549435c43950c6b7d7f0
            test -f "$low_path" || { echo LOW_MISSING; exit 1; }
            test -f "$high_path" || { echo HIGH_MISSING; exit 1; }
            test "$(sha256sum "$low_path" | cut -d' ' -f1)" = "$low_hash" || { echo LOW_HASH_MISMATCH; exit 1; }
            test "$(sha256sum "$high_path" | cut -d' ' -f1)" = "$high_hash" || { echo HIGH_HASH_MISMATCH; exit 1; }
            echo BOTH_ORIGINALS_VERIFIED
            dest="$dir/stage33-catalog-$2"
            log="$dir/stage33-intake-$2.log"
            if ! PCG_PRIVATE_LOCAL=1 ../venv/bin/python lab/reference_intake33.py --low "$low_path" --high "$high_path" --out "$dest" > "$log" 2>&1; then
              echo PRIVATE_SOURCE_INTAKE_FAILED
              ../venv/bin/python - "$log" <<'PY'
            import re,sys
            from pathlib import Path
            t=Path(sys.argv[1]).read_text(errors='replace')
            # Only known generic parser error categories, no filenames or source details.
            categories=['no supported geometry','unsupported nontriangle mode','missing or escaping URI','meshopt compressed buffer unsupported','Draco unsupported','accessor bounds','invalid ring','no nondegenerate triangles','archive limit','duplicate archive entry']
            print('INTAKE_ERROR_CATEGORY',next((x for x in categories if x in t),'other (private local log)'))
            PY
              exit 1
            fi
            ../venv/bin/python - "$dest/catalog.json" <<'PY'
            import json,sys,statistics
            from pathlib import Path
            r=json.loads(Path(sys.argv[1]).read_text())
            for key in ('low','high'):
                a=[x for x in r['objects'] if x['source'].startswith(key)]
                assert a
                print('INTAKE_AGGREGATE',key,json.dumps(dict(groups=len(a),triangles=sum(x['triangles_input'] for x in a),median_triangles=statistics.median(x['triangles_input'] for x in a),degenerate=sum(x['degenerate'] for x in a),uv_triangles=sum(x['uv0_triangles'] for x in a),uv_nonzero=sum(x['uv0_nonzero_triangles'] for x in a),ground_outlines=sum(x['footprint_kind']=='near_ground_surface' for x in a))))
            print('ATLAS_MAPS_PRESENT',len(r['external_unassigned_maps']))
            for x in r['roughness_candidates']:
                a=x['analysis']
                print('ROUGHNESS_AGGREGATE',json.dumps({k:a[k] for k in ('width','height','dark_fraction','rectangular_candidates')}))
            PY
            echo PRIVATE_SOURCE_INTAKE_PASS
        run: |
          py -3 -u -c "import subprocess,sys,os; sys.exit(subprocess.run(['wsl.exe','--exec','bash','--noprofile','--norc','-s','--',os.environ['USERPROFILE'],os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']],input=os.environ['PCG_SCRIPT'].replace(chr(13), '').encode('utf-8'),timeout=660).returncode)"
