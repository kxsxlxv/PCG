name: PCG Stage 33 private intake preflight
on:
  push:
    branches:
      - research/self-hosted-runner-smoke
    paths:
      - .github/workflows/stage33-intake-preflight.yml
permissions: {}
jobs:
  preflight:
    if: github.repository == 'kxsxlxv/PCG' && github.ref == 'refs/heads/research/self-hosted-runner-smoke' && github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    steps:
      - name: Synthetic tests and optional private local intake
        shell: cmd
        env:
          PCG_SCRIPT: |
            set -euo pipefail
            export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_TERMINAL_PROMPT=0
            export PYTHONHASHSEED=0 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
            work=$(mktemp -d -t pcg-stage33.XXXXXXXX)
            trap 'rm -rf -- "$work"' EXIT
            cd "$work"
            python3 -m venv venv
            git init -q src
            cd src
            git -c core.hooksPath=/dev/null fetch --quiet --depth=1 https://github.com/kxsxlxv/PCG.git ab608e8829daa3e70931edd8599b200e520be6fd
            git -c core.hooksPath=/dev/null checkout --quiet --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = ab608e8829daa3e70931edd8599b200e520be6fd
            ../venv/bin/python -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple --no-cache-dir -r lab/requirements.txt
            export PYTHONPATH=src:lab
            ../venv/bin/python -m unittest discover -s tests/unit -v
            echo STAGE33_SYNTHETIC_PASS
            low=buildings_2012.zip
            high=a69803a3e1134ec7ba96398d19eb8ade.gltf
            win=$(wslpath -a -u "$1")
            # Locate exact source names only, independently; do not enumerate
            # personal directories. Verify against the original reference digests.
            low_path=''; high_path=''
            low_hash=8082c844fd66ddcc1cd8606c55ab1dc74e02edc3977c662ed87f5beeeffbeb8e
            high_hash=85bd5d73832d0cc3e2f6f9cd429b32c05614ba4ab0ee549435c43950c6b7d7f0
            match_file() {
              [ -f "$1" ] && [ "$(sha256sum "$1" | cut -d' ' -f1)" = "$2" ]
            }
            for dir in "$HOME/pcg-reference" "$win/pcg-reference" "$win/Downloads"; do
              if [ -z "$low_path" ] && match_file "$dir/$low" "$low_hash"; then low_path="$dir/$low"; fi
              if [ -z "$high_path" ] && match_file "$dir/$high" "$high_hash"; then high_path="$dir/$high"; fi
            done
            # The project's designated donor library, not the general disk.
            library=/mnt/d/Graphics/Assets
            if [ -d "$library" ]; then
              while IFS= read -r -d '' p; do
                case "${p##*/}" in
                  "$low") if [ -z "$low_path" ] && match_file "$p" "$low_hash"; then low_path="$p"; fi;;
                  "$high") if [ -z "$high_path" ] && match_file "$p" "$high_hash"; then high_path="$p"; fi;;
                esac
                if [ -n "$low_path" ] && [ -n "$high_path" ]; then break; fi
              done < <(find "$library" -type f \( -name "$low" -o -name "$high" \) -print0 2>/dev/null)
            fi
            if [ -n "$low_path" ]; then echo EXACT_LOW_SOURCE_AVAILABLE; else echo EXACT_LOW_SOURCE_NOT_FOUND; fi
            if [ -n "$high_path" ]; then echo EXACT_HIGH_SOURCE_AVAILABLE; else echo EXACT_HIGH_SOURCE_NOT_FOUND; fi
            if [ -z "$low_path" ] || [ -z "$high_path" ]; then
              echo PRIVATE_SOURCE_GATE_BLOCKED
              exit 0
            fi
            dest="$win/pcg-reference/stage33-catalog-$2"
            mkdir -p "$win/pcg-reference"
            if PCG_PRIVATE_LOCAL=1 ../venv/bin/python lab/reference_intake33.py --low "$low_path" --high "$high_path" --out "$dest" > "$win/pcg-reference/stage33-intake-$2.log" 2>&1; then
              echo PRIVATE_SOURCE_INTAKE_PASS
            else
              echo PRIVATE_SOURCE_INTAKE_FAILED_SEE_LOCAL_LOG
              exit 1
            fi
        run: |
          py -3 -u -c "import subprocess,sys,os; sys.exit(subprocess.run(['wsl.exe','--exec','bash','--noprofile','--norc','-s','--',os.environ['USERPROFILE'],os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']],input=os.environ['PCG_SCRIPT'].replace(chr(13), '').encode('utf-8'),timeout=660).returncode)"
