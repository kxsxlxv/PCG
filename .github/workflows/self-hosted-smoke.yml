name: PCG self-hosted runner smoke
on:
  push:
    branches:
      - research/self-hosted-runner-smoke
    paths:
      - .github/workflows/self-hosted-smoke.yml
  workflow_dispatch:
permissions: {}
jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64]
    if: github.repository == 'kxsxlxv/PCG' && github.ref == 'refs/heads/research/self-hosted-runner-smoke'
    timeout-minutes: 3
    steps:
      - name: Verify runner and tool availability (read-only)
        shell: cmd
        env:
          ACTUAL_RUNNER_NAME: ${{ runner.name }}
          ACTUAL_RUNNER_OS: ${{ runner.os }}
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          echo Runner: %ACTUAL_RUNNER_NAME% %ACTUAL_RUNNER_OS%/%ACTUAL_RUNNER_ARCH%
          if not "%ACTUAL_RUNNER_NAME%"=="DESKTOP-UM6MS08" exit /b 1
          for %%T in (python py git node g++ wsl docker) do (
            where %%T >nul 2>&1
            if errorlevel 1 (echo %%T available: false) else (echo %%T available: true)
          )
          echo RUNNER_SMOKE_PASS
          exit /b 0
