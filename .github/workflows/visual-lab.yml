name: PCG Visual Lab
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install -r lab/requirements.txt
          mkdir -p artifacts
          python -m pip freeze > artifacts/versions.txt
      - name: Run research probes
        run: python lab/run_probes.py
      - name: Report
        if: always()
        run: |
          echo '## PCG probe report' >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/report.json ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/report.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcg-visual-lab
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
