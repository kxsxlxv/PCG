name: PCG Visual Lab
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install -r lab/requirements.txt
          mkdir -p artifacts
          python -m pip freeze > artifacts/versions.txt
      - name: Prepare software EGL context
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: surfaceless
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libegl-dev libgl1 libgl1-mesa-dri
          python -m pip install moderngl==5.12.0 glcontext==3.0.0
          python -c 'import moderngl, ctypes.util; c=moderngl.create_context(standalone=True,backend="egl",require=330,libegl=ctypes.util.find_library("EGL"),libgl=ctypes.util.find_library("GL")); print(c.info["GL_RENDERER"])'
      - name: Test core contracts
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m unittest discover -s tests/unit -v 2>&1 | tee artifacts/core-tests.log
      - name: Render core shells
        env:
          PYTHONPATH: src
        run: python lab/render_core_shell.py
      - name: Zero-geometry batched facade research
        env:
          PYTHONPATH: src
        run: python lab/render_zero_geometry_facades.py
      - name: Neutral zero-geometry tile integration reference
        env:
          PYTHONPATH: src
        run: python lab/compile_zero_geometry_tile.py
      - name: Multi-tile compiler and cross-language ABI
        env:
          PYTHONPATH: src
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror lab/zero_tile_abi_check.cpp -o /tmp/pcg_zero_tile_abi
          python lab/compile_zero_tiles.py --self-test --decoder /tmp/pcg_zero_tile_abi
      - name: Approved synthetic GIS pilot zero-opening ABI bridge
        env:
          PYTHONPATH: src
        run: |
          python lab/pack_approved_pilot_zero_tiles.py --decoder /tmp/pcg_zero_tile_abi
      - name: Software GLSL facade shader reference
        env:
          PYTHONPATH: src
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: surfaceless
        run: |
          python lab/render_zero_facade_glsl.py
      - name: Actual 1024-building export and bundle verification
        env:
          PYTHONPATH: src
        run: |
          python lab/stress_zero_tiles.py
      - name: Run research probes
        run: python lab/run_probes.py
      - name: Report
        if: always()
        run: |
          echo '## PCG probe report' >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/report.json ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/report.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcg-visual-lab
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
