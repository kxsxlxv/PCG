name: PCG Stage 31 independent artifact audit
on:
  push:
    branches:
      - research/self-hosted-runner-smoke
    paths:
      - .github/workflows/stage31-visual-audit.yml
permissions:
  actions: read
  contents: read
jobs:
  audit:
    if: github.repository == 'kxsxlxv/PCG' && github.ref == 'refs/heads/research/self-hosted-runner-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify completed exact source CI and download artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/kxsxlxv/PCG/actions/runs/46019490755
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          done_run=false
          for i in $(seq 1 144); do
            curl -fsS "${auth[@]}" "$api" -o "$RUNNER_TEMP/source.json"
            test "$(jq -r .head_sha "$RUNNER_TEMP/source.json")" = e0c31ab003a6d9cb9e9d024166d9effe652187f7
            if test "$(jq -r .status "$RUNNER_TEMP/source.json")" = completed; then
              test "$(jq -r .conclusion "$RUNNER_TEMP/source.json")" = success
              done_run=true
              break
            fi
            sleep 5
          done
          test "$done_run" = true
          curl -fsS "${auth[@]}" "$api/artifacts?name=pcg-visual-lab" -o "$RUNNER_TEMP/artifact.json"
          test "$(jq -r '.artifacts | length' "$RUNNER_TEMP/artifact.json")" = 1
          id=$(jq -r '.artifacts[0].id' "$RUNNER_TEMP/artifact.json")
          digest=$(jq -r '.artifacts[0].digest' "$RUNNER_TEMP/artifact.json")
          echo "SOURCE_ARTIFACT $id $digest"
          curl -fLsS --retry 2 "${auth[@]}" "https://api.github.com/repos/kxsxlxv/PCG/actions/artifacts/$id/zip" -o "$RUNNER_TEMP/stage31.zip"
          echo "${digest#sha256:}  $RUNNER_TEMP/stage31.zip" | sha256sum -c
      - name: Install image decoder
        run: python -m pip install Pillow==12.3.0
      - name: Verify manifest and inspect actual rendered images
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, zipfile
          from collections import Counter
          from PIL import Image
          def emit(im,key,max_size):
              im.thumbnail(max_size)
              b=io.BytesIO();im.save(b,format='JPEG',quality=84,optimize=True)
              s=base64.b64encode(b.getvalue()).decode('ascii')
              print('AUDIT_IMAGE_BEGIN',key,len(s),flush=True)
              for i in range(0,len(s),2048):
                  print('AUDIT_IMAGE_CHUNK',key,s[i:i+2048],flush=True)
              print('AUDIT_IMAGE_END',key,flush=True)
          with zipfile.ZipFile(os.path.join(os.environ['RUNNER_TEMP'],'stage31.zip')) as z:
              prefix=next(n[:-len('bundle.json')] for n in z.namelist() if n.endswith('zero-volume-grammar/bundle.json'))
              manifest=json.loads(z.read(prefix+'bundle.json'))
              for path,digest in manifest.items():
                  assert hashlib.sha256(z.read(prefix+path)).hexdigest()==digest,path
              report=json.loads(z.read(prefix+'report.json'))
              stress=json.loads(z.read(prefix+'stress.json'))
              ref28=Counter();ref29=Counter();accepted=total=0
              for r in report['refinements']:
                  ref28.update(r['stage28']);ref29.update(r['stage29']['variants'])
                  accepted+=r['stage29']['accepted'];total+=r['stage29']['total']
              print('AUDIT_STAGE31',json.dumps(dict(verified_files=len(manifest),near=report['near_total'],lite=report['lite_total'],baseline_near=report['legacy_near_total'],baseline_lite=report['legacy_lite_total'],max_near=report['near_max'],min_iou=min(x['near_lite_iou'] for x in report['views']),projected_columns=report['projected_columns'],roof_cores=report['roof_cores'],entries=report['secondary_entries'],stage28=dict(ref28),stage29=dict(ref29),equipment_accepted=accepted,equipment_total=total,stress={k:v for k,v in stress.items() if k!='rows'},cases=[dict(id=x['id'],near=x['grammar']['near'],lite=x['grammar']['lite'],old=x['legacy']['near']) for x in report['cases']])),flush=True)
              for i in range(2):
                  im=Image.open(io.BytesIO(z.read(prefix+f'comparison_{i}.png'))).convert('RGB')
                  for j in range(2):
                      emit(im.crop((0,j*1144,im.width,min((j+1)*1144,im.height))),f'sheet{i}_{j}',(1100,1100))
              for name in ('walkup_sections_0','section_slab_0','tower_stacks_0','tall_bay_tower_1'):
                  p=prefix+name+'_grammar.png'
                  im=Image.open(io.BytesIO(z.read(p))).convert('RGB')
                  assert im.size==(1280,960)
                  emit(im,name,(1280,960))
          print('STAGE31_INDEPENDENT_ARTIFACT_AUDIT_PASS')
          PY
