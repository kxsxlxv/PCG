name: PCG Stage 33 measured architecture archive and scale audit
on:
  push:
    branches: [research/self-hosted-runner-smoke]
    paths: [.github/workflows/stage33-calibrated-audit.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src:lab
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      LIBGL_ALWAYS_SOFTWARE: "1"
      EGL_PLATFORM: surfaceless
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3f264b40d5d9c6efb8eee7788ed2c495f58bd2e5
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and verify exact fresh compile archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          curl -fsS "${auth[@]}" https://api.github.com/repos/kxsxlxv/PCG/actions/runs/46132144357 -o "$RUNNER_TEMP/run.json"
          test "$(jq -r .conclusion "$RUNNER_TEMP/run.json")" = success
          test "$(jq -r .head_sha "$RUNNER_TEMP/run.json")" = 3f264b40d5d9c6efb8eee7788ed2c495f58bd2e5
          curl -fLsS --retry 2 "${auth[@]}" https://api.github.com/repos/kxsxlxv/PCG/actions/artifacts/15258422722/zip -o "$RUNNER_TEMP/result.zip"
          echo "d9dfff8a3fd0c6762b165dc98784946a4a999bd37fb4e64f80cb8aff55cf0957  $RUNNER_TEMP/result.zip" | sha256sum -c
          curl -fLsS --retry 2 "${auth[@]}" https://api.github.com/repos/kxsxlxv/PCG/actions/artifacts/15258238423/zip -o "$RUNNER_TEMP/first-scale.zip"
          echo "1da446899abcfa3ab8206f2010b5cd342534908b56d4826a57a3c439d4de8079  $RUNNER_TEMP/first-scale.zip" | sha256sum -c
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'first-scale.zip') as z:
              r=json.loads(z.read('report.json'))
              assert r['plans']==983 and len(r['failures'])==41
              assert all(x['rule']=='walkup_sections' and x['error']=='ValueError: incompatible explicit archetype' for x in r['failures']),r['failures']
              print('FIRST_SCALE_INVALID_ARCHETYPE_CASES',len(r['failures']))
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'result.zip') as z:
              m=json.loads(z.read('bundle.json'))
              for n,h in m.items():
                  p=Path(n);assert not p.is_absolute() and '..' not in p.parts
                  assert hashlib.sha256(z.read(n)).hexdigest()==h,n
              z.extractall('verified')
              r=json.loads(z.read('report.json'))
              assert len(r['cases'])==16 and len(r['calibration'])==10
              assert r['eligible_contours']=={'low':42,'high':34}
              assert all(x['geometry_intents_changed'] for x in r['cases'] if x['calibrated'])
              assert all(not x['geometry_intents_changed'] for x in r['cases'] if not x['calibrated'])
              print('CALIBRATED33_ARCHIVE_VERIFIED',len(m))
          PY
      - name: Install dependencies
        run: |
          python -m pip install -r lab/requirements.txt moderngl==5.12.0 glcontext==3.0.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libegl-dev libgl1 libgl1-mesa-dri
      - name: Independently decode both PCGF tiles and inspect exported meshes
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror lab/zero_tile_abi_check.cpp -o "$RUNNER_TEMP/pcg_zero_tile_abi"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          import numpy as np
          from compile_zero_tiles import LAYERS
          from reference_integrated33 import verify
          import zero_photoreal as prev
          p=Path('verified');verify(p)
          result=[]
          for i in range(2):
              q=p/f'grammar_{i}';table=json.loads((q/'parameters.json').read_text())
              records=json.loads((q/'plans.json').read_text());placements=json.loads((q/'placements.json').read_text())
              with np.load(q/'gpu_metadata.npz') as z:meta=z['metadata'];ops=z['openings'];cut=z['cutout_face_records']
              with np.load(q/'donor_opening_sidecar.npz') as z:ext=z['openings']
              np.testing.assert_array_equal(ext[:,:3],ops)
              k=ext[:,3,0]>0;assert np.all(ops[k,2,0]==1) and np.all(ops[k,2,1]==0)
              bounds=prev.envelopes(records,placements)
              remap={(r['building'],r['kind']):r['id'] for r in json.loads((q/'cutout_records.json').read_text())}
              counts=[]
              for name in ('tile_opaque.glb','tile_lite_opaque.glb'):
                  scene,owner,cuts,nv,_=prev.load_scene(q,name,table,bounds)
                  scene,face=prev.remap_scene(scene,cuts,remap,nv);np.testing.assert_array_equal(face,cut)
                  counts.append(len(scene[0])//3)
              cpp=json.loads(subprocess.run([str(Path(os.environ['RUNNER_TEMP'])/'pcg_zero_tile_abi'),str(q/'facade_params.bin'),str(q/'facade_cells.bin'),str(len(LAYERS))],capture_output=True,text=True,check=True).stdout)
              assert cpp['records']==len(table)
              result.append(dict(tile=i,near=counts[0],lite=counts[1],windows=int(k.sum()),records=len(table),cells=cpp['cells']))
          r=json.loads((p/'report.json').read_text())
          assert sum(x['near'] for x in result)==r['near_total']
          assert sum(x['lite'] for x in result)==r['lite_total']
          assert sum(x['windows'] for x in result)==sum(x['windows'] for x in r['assignments'])
          print('CALIBRATED33_DECODE_AUDIT',json.dumps(result),flush=True)
          PY
      - name: 1024 measured planning cases and 64 complete base detail allocations
        run: |
          python -u - <<'PY'
          import json,math,time,traceback
          from pathlib import Path
          from dataclasses import asdict
          from collections import Counter
          import numpy as np
          from pcg.footprint import Footprint
          from pcg.reference_grammar import RULES,build,baseline
          from reference_calibration33 import choose
          from unified_detail import plan
          from zero_roof_construction import swept_pipe
          m=json.loads(Path('verified/measured_features.json').read_text())
          rng=np.random.default_rng(33034)
          names=('walkup_sections','long_slab','section_slab','tower_stacks','tall_bay_tower')
          stress=[];fail=[];detail=[];t0=time.monotonic()
          invalid=0
          for i in range(41):
              f=Footprint(f'invalid33:{i}',[(0,0),(32+i,0),(32+i,16),(0,16)])
              spec=dict(footprint=f,rule='walkup_sections',floors=3,eave=8.7,top=8.7,roof='flat',party=())
              p,_=choose(spec,m['contours'],m['facades'])
              try:build(f,'walkup_sections',3,8.7,roof='flat',eave=8.7,volume=True,measured=p)
              except ValueError as e:
                  assert str(e)=='incompatible explicit archetype';invalid+=1
              else:raise AssertionError('unsupported explicit archetype silently accepted')
          print('SCALE_NEGATIVE_CASES',invalid,flush=True)
          for i in range(1024):
              name=names[i%len(names)];kind=(i//5)%4
              w=float(rng.uniform(32,98) if name in names[:3] else rng.uniform(19,46))
              d=float(rng.uniform(14,24) if kind!=2 else rng.uniform(28,38))
              n=int(rng.integers(4,7) if name==names[0] else rng.integers(6,16) if name in names[1:3] else rng.integers(10,25))
              # A courtyard requires an actual usable perimeter band.
              if kind==2:w=max(w,30.)
              h=n*RULES[name].pitch
              outer=[(0,0),(w,0),(w,d),(0,d)];holes=[]
              if kind==1:outer=[(0,0),(w,0),(w,d*.56),(w*.60,d*.56),(w*.60,d),(0,d)]
              if kind==2:holes=[[(w*.27,d*.30),(w*.73,d*.30),(w*.73,d*.70),(w*.27,d*.70)]]
              if kind==3:outer=[(0,0),(w,0),(w,d),(w*.67,d),(w*.67,d*.72),(w*.36,d*.72),(w*.36,d),(0,d)]
              angle=float(rng.uniform(-math.pi,math.pi))
              R=np.array([[math.cos(angle),-math.sin(angle)],[math.sin(angle),math.cos(angle)]])
              outer=(np.array(outer)@R.T).tolist();holes=[(np.array(q)@R.T).tolist() for q in holes]
              f=Footprint(f'stress33:{i}',outer,holes);party=((0,1),) if i%7==0 else ()
              spec=dict(footprint=f,rule=name,floors=n,eave=h,top=h,roof='flat',party=party)
              try:
                  p,source=choose(spec,m['contours'],m['facades'])
                  v,ref=build(f,name,n,h,roof='flat',eave=h,party_edges=party,volume=True,measured=p)
                  assert v.top_m==h and v.eave_m==h and v.plan.footprint_digest==f.digest()
                  assert all(not w.openings for w in v.plan.facades if w.party)
                  assert all(o.role!='balcony_door' for w in v.plan.facades if w.courtyard or w.party for o in w.openings)
                  shell=len(v.mass.shell.triangles())
                  assert shell+ref.reserved_triangles+ref.planned_triangles<=1800
                  stress.append(dict(i=i,shape=kind,rule=name,pack=source['geometry_pack'],shell=shell,planned=ref.planned_triangles,reserve=ref.reserved_triangles,openings=sum(len(w.openings) for w in v.plan.facades)))
                  if i%16==0:
                      f2=Footprint(f.building_id,list(reversed(outer)),[list(reversed(q)) for q in holes])
                      v2,r2=build(f2,name,n,h,roof='flat',eave=h,party_edges=party,volume=True,measured=p)
                      assert f2.digest()==f.digest() and v2.plan.digest()==v.plan.digest() and r2==ref
                      old=baseline(f,RULES[name],n,h,roof='flat',eave=h,party_edges=party)
                      assert v.mass.shell==old.mass.shell
                      record=dict(id=f.building_id,footprint=asdict(f),decision=v.decision(),architecture=asdict(v.plan),offset=[0.,0.,0.],reference_grammar=ref.canonical())
                      q=plan(record,swept_pipe,(f,v),ref,efficient=True)
                      assert 0<q['lite']<=q['near']<=1800
                      detail.append(dict(i=i,near=q['near'],lite=q['lite'],checks=q['checks'],rejections=len(q['rejected'])))
              except Exception as e:
                  fail.append(dict(i=i,shape=kind,rule=name,error=type(e).__name__+': '+str(e),trace=traceback.format_exc(limit=4)))
                  if len(fail)<=4:print('SCALE_FAILURE',json.dumps(fail[-1]),flush=True)
              if i%128==127:print('SCALE_PROGRESS',i+1,len(stress),len(detail),len(fail),flush=True)
          result=dict(plans=len(stress),detail_cases=len(detail),expected_invalid_rejections=invalid,failures=fail,shapes=dict(Counter(x['shape'] for x in stress)),
            pack_counts=dict(Counter(x['pack'] for x in stress)),planned_max=max((x['shell']+x['planned']+x['reserve'] for x in stress),default=0),
            detail_near_max=max((x['near'] for x in detail),default=0),detail_lite_max=max((x['lite'] for x in detail),default=0),
            detail_checks=sum(x['checks'] for x in detail),elapsed_seconds=time.monotonic()-t0,scope='planning and unified detail allocator only; not full GLB/28/29 GPU scale benchmark')
          out=Path('scale');out.mkdir();(out/'report.json').write_text(json.dumps(result,indent=2));(out/'cases.json').write_text(json.dumps(dict(plans=stress,detail=detail),indent=2))
          print('CALIBRATED33_SCALE',json.dumps({k:v for k,v in result.items() if k!='failures'}),flush=True)
          assert not fail and len(stress)==1024 and len(detail)==64 and invalid==41
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcg-stage33-calibrated-scale-valid
          path: scale
          if-no-files-found: warn
          retention-days: 14
